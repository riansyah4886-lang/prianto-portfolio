<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

<body>

            <p>Deskripsi singkat proyek 1.</p>
            <a href="https://link-proyek1.com" target="_blank">Lihat Detail</a>
          </div>

      </div>

      <!-- Card 2 -->
      <div class="card">
        <div class="card-inner">
          <div class="card-front">
            <img src="images/proyek2.jpg" alt="Proyek 2">
            <h3>Judul Proyek 2</h3>
          </div>
          <div class="card-back">
            <p>Deskripsi singkat proyek 2.</p>
            <a href="https://link-proyek2.com" target="_blank">Lihat Detail</a>
          </div>
        </div>
      </div>

      <!-- Ulangi sampai 6 card -->
    </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Prianto. Semua Hak Dilindungi.</p>
  </footer>

</html>
